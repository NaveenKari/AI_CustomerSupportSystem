spring.application.name=CustomerSupportSystem
server.port=8080

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/customer_support_db
spring.datasource.username=postgres
spring.datasource.password=8121
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── pgvector (AI Knowledge Base) ──────────────────────────────────────────────
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true

# ── Anthropic (Claude) ────────────────────────────────────────────────────────
spring.ai.anthropic.api-key=your_anthropic_api_key
spring.ai.anthropic.chat.options.model=claude-sonnet-4-6
spring.ai.anthropic.chat.options.max-tokens=1024

# ── File Upload (PDF Knowledge Base) ─────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.pdf.storage-path=/tmp/customer-support/pdfs

# ── Admin Credentials (override in prod with env vars) ───────────────────────
app.admin.email=admin@example.com
app.admin.password=changeme

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5174
